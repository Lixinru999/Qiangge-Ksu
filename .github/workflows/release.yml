name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  build-phone:
    uses: ./.github/workflows/build-phone.yml
    secrets: inherit
  release:
    needs:
      - build-manager
      - build-phone
    runs-on: ubuntu-latest
    # 没有这个，GITHUB_TOKEN 默认只读，创建 Release 会 403
    # "Resource not accessible by integration"（实测踩过）。
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_sevenk.ko"
                KO="$(ls $dir/*_sevenk.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

      - name: Rename phone apk
        run: |
          mkdir -p phone
          for f in ./phone-app/*.apk; do
            if [ -f "$f" ]; then
              mv "$f" "phone/Qiangge_Phone-release.apk"
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            manager/*.apk
            lkm/lkm-*_sevenk.ko
            ksud/ksud-*
            ksuinit/*
            phone/*.apk
